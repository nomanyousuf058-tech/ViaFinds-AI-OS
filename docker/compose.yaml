services:
  postgres:
    image: postgres:16
    container_name: viafinds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: Stranger.boy058
      POSTGRES_DB: n8n
    ports:
      - "5432:5432"
    volumes:
      - F:/ViaFinds-AI-OS/data/postgres:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: viafinds-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@viafinds.com
      PGADMIN_DEFAULT_PASSWORD: Stranger.boy058
    ports:
      - "5050:80"
    depends_on:
      - postgres

  n8n:
    image: n8nio/n8n:latest
    container_name: viafinds-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: Stranger.boy058

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Karachi
    depends_on:
      - postgres
    volumes:
      - F:/ViaFinds-AI-OS/data/n8n:/home/node/.n8n