<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-ui-body text-ui-body">
<!-- Main Container -->
<main class="w-full max-w-[420px] bg-charcoal-surface border border-slate-border rounded-lg shadow-2xl relative overflow-hidden flex flex-col items-center p-8 md:p-12 z-10">
<!-- Subtle Top Glow (Admin context) -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<!-- Header / Brand -->
<div class="mb-10 text-center flex flex-col items-center">
<span class="material-symbols-outlined text-4xl text-on-surface mb-4" style="font-variation-settings: 'FILL' 1;">
                lock
            </span>
<h1 class="font-headline-lg text-headline-lg md:font-headline-xl md:text-headline-xl text-on-surface tracking-tight">Viafinds</h1>
<p class="font-mono-data text-mono-data text-on-surface-variant mt-2 tracking-widest uppercase opacity-80">Admin Access</p>
</div>
<!-- Form Section -->
<form action="#" class="w-full flex flex-col gap-6" method="POST" onsubmit="event.preventDefault();">
<!-- Email/Username Field -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="username">Identification</label>
<div class="relative flex items-center group input-focus-ring border border-slate-border rounded-DEFAULT overflow-hidden transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant ml-3 text-lg opacity-70 group-focus-within:text-primary-container transition-colors">
                        person
                    </span>
<input autocomplete="username" class="w-full bg-obsidian-deep text-on-surface font-mono-data text-mono-data px-3 py-3 border-none focus:ring-0 placeholder:text-outline-variant transition-colors" id="username" name="username" placeholder="Email or Username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-baseline">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Passphrase</label>
<a class="font-mono-data text-mono-data text-primary hover:text-inverse-primary transition-colors duration-200" href="#">Reset?</a>
</div>
<div class="relative flex items-center group input-focus-ring border border-slate-border rounded-DEFAULT overflow-hidden transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant ml-3 text-lg opacity-70 group-focus-within:text-primary-container transition-colors">
                        key
                    </span>
<input autocomplete="current-password" class="w-full bg-obsidian-deep text-on-surface font-mono-data text-mono-data px-3 py-3 border-none focus:ring-0 placeholder:text-outline-variant transition-colors" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant opacity-50 hover:opacity-100 transition-opacity flex items-center" type="button">
<span class="material-symbols-outlined text-sm">visibility_off</span>
</button>
</div>
</div>
<!-- Action Area -->
<div class="mt-4 flex flex-col gap-4">
<button class="w-full bg-primary-container hover:bg-inverse-primary text-white font-label-caps text-label-caps py-4 rounded-DEFAULT flex items-center justify-center gap-2 transition-colors duration-300 shadow-[0_0_15px_rgba(0,71,255,0.15)] hover:shadow-[0_0_20px_rgba(0,71,255,0.3)]" type="submit">
                    Authenticate
                    <span class="material-symbols-outlined text-sm font-bold">arrow_forward</span>
</button>
<div class="text-center font-mono-data text-[11px] text-outline-variant mt-2">
                    Secured by Viafinds Enterprise Gatekeeper. <br/> Unauthorized access is prohibited.
                </div>
</div>
</form>
</main>
<!-- Ambient Background Elements (Subtle) -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[10%] left-[20%] w-[40vw] h-[40vw] bg-primary-container rounded-full opacity-[0.02] blur-[100px] mix-blend-screen"></div>
